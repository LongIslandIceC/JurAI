<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Seite nicht gefunden - Die angeforderte Seite existiert nicht. Zurück zur JurAI Startseite.">
    <title>404 - Seite nicht gefunden - JurAI</title>
    <link rel="icon" type="image/png" href="assets/logo gold-taupe/jai_logo_taupe_128.png">
    <link rel="apple-touch-icon" href="assets/logo gold-taupe/jai_logo_taupe_256.png">
    <link rel="stylesheet" href="css/styles.css?v=78.0">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);
            padding: var(--spacing-md);
        }

        .error-content {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }

        .error-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--color-primary);
        }

        .error-description {
            font-size: var(--font-size-md);
            color: var(--color-text-light);
            margin-bottom: var(--spacing-lg);
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="logo">

                </a>
                <div class="nav-links">
                    <a href="index.html#about" class="nav-link">
                        <span class="nav-text">Über uns</span>
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>

                    </a>
                    <a href="index.html#leistungen" class="nav-link">
                        <span class="nav-text">Leistungen</span>

                            <rect x="9" y="10" width="6" height="4" rx="0.5"/>
                        </svg>
                    </a>
                    <a href="index.html#kontakt" class="nav-link cta-button">

                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>

                    </a>

                    <span></span>
                    <span></span>
                    <span></span>
                </button>

        </div>
    </nav>

    <div class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Seite nicht gefunden</h1>
            <p class="error-description">
                Die von Ihnen gesuchte Seite existiert leider nicht oder wurde verschoben.
                Kehren Sie zur Startseite zurück oder kontaktieren Sie uns bei Fragen.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">Zur Startseite</a>
                <a href="index.html#kontakt" class="btn btn-secondary">Kontakt aufnehmen</a>
            </div>
        </div>
    </div>


    <script src="js/main.js?v=11.0"></script>

</html>
